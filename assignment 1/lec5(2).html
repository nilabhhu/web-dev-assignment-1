<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIST</title>
</head>
<body>
    <table Border="5" cellpadding="10" cellspacing="10">
        <thead>
        <tr>
            <th>DAY / TIME</th>
            <th colspan="2">9:00 - 11:00</th>
            <!-- to merge columns add the number of columns and add colspan -->
            <!-- <th>10:00 - 11:00</th> -->
            <th>11:00 - 12:00</th>
            <th>LUNCH</th>
            <th>1:00 - 2:00</th>
          </thead>
          <thead>
            <tr>
                <th>MONDAY</th>
                <td>Maths</td>
                <td>English</td>
                <td>Science</td>
                <td rowspan="5">LUNCH BREAK</td>
                <!-- to merge rows add the number of rows and add rowspan -->
                <td>Computer</td>
            </tr>
            <tr>
                <th>TUESDAY</th>
                <td>Science</td>
                <td>Maths</td>
                <td>English</td>
                <td>Computer</td>
            </tr>
            <tr>
                <th>WEDNESDAY</th>
                <td>English</td>
                <td>Science</td>
                <td>Maths</td>
                <td>Computer</td>
            </tr>
            <tr>
                <th>THURSDAY</th>
                <td>Maths</td>
                <td>English</td>
                <td>Science</td>
                <td>Computer</td>
            </tr>
            <tr>
                <td>FRIDAY</td>
                <td>Science</td>
                <td>Maths</td>
                <td>English</td>
                <td>Computer</td>
            </tr>
          </thead>
    </table>
    
</body>
</html>
